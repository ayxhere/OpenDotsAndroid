# Builds the OpenDots Android debug APK:
#   upstream OpenDots -> backend bundle (+ smoke test) -> libnode.so ->
#   Gradle assembleDebug + JVM unit tests -> APK artifact.
#
# No signing keys, secrets, or credentials are used or committed anywhere.
name: Android debug APK

on:
  push:
  pull_request:
  workflow_dispatch:

# Minimal permissions: the workflow only reads the repo.
permissions:
  contents: read

env:
  NODE_VERSION: "24"
  JAVA_VERSION: "21"
  UPSTREAM_TARBALL: https://github.com/CopilotKit/OpenDots/archive/refs/heads/main.tar.gz
  NODEJS_MOBILE_URL: https://github.com/digidem/nodejs-mobile/releases/download/v24.20.0-0/nodejs-mobile-android-24.20.0-0.zip

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;26.3.11579264"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"

      - name: Download OpenDots upstream source
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/opendots-main.tar.gz "$UPSTREAM_TARBALL"
          rm -rf /tmp/OpenDots-main
          tar -xzf /tmp/opendots-main.tar.gz -C /tmp
          test -d /tmp/OpenDots-main || { echo "FATAL: upstream extract dir missing"; exit 1; }
          echo "Upstream HEAD tarball extracted:"
          ls /tmp/OpenDots-main | head

      - name: Build backend bundle
        shell: bash
        run: |
          set -euo pipefail
          bash backend/scripts/build-backend-bundle.sh "/tmp/OpenDots-main" "$GITHUB_WORKSPACE/backend-bundle-out"
          test -f "$GITHUB_WORKSPACE/backend-bundle-out/opendots-backend.zip" \
            || { echo "FATAL: opendots-backend.zip not produced"; exit 1; }
          test -f "$GITHUB_WORKSPACE/backend-bundle-out/opendots-backend-version.txt" \
            || { echo "FATAL: opendots-backend-version.txt not produced"; exit 1; }

      - name: Smoke-test backend bundle
        shell: bash
        run: |
          set -euo pipefail
          bash backend/scripts/smoke-test.sh "$GITHUB_WORKSPACE/backend-bundle-out/opendots-backend.zip"
          # Any non-zero exit from smoke-test.sh fails this step and the job.

      - name: Stage backend bundle into app assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          cp "$GITHUB_WORKSPACE/backend-bundle-out/opendots-backend.zip" \
             "$GITHUB_WORKSPACE/backend-bundle-out/opendots-backend-version.txt" \
             app/src/main/assets/
          ls -la app/src/main/assets/

      - name: Download nodejs-mobile and extract libnode.so
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/nodejs-mobile.zip "$NODEJS_MOBILE_URL"
          rm -rf /tmp/nodejs-mobile
          mkdir -p /tmp/nodejs-mobile
          unzip -q /tmp/nodejs-mobile.zip -d /tmp/nodejs-mobile
          for abi in arm64-v8a armeabi-v7a x86_64; do
            so="$(find /tmp/nodejs-mobile -path "*${abi}*/libnode.so" | head -n 1)"
            if [ -z "$so" ]; then
              echo "FATAL: libnode.so for ABI $abi not found in nodejs-mobile zip"
              unzip -l /tmp/nodejs-mobile.zip | head -n 60
              exit 1
            fi
            mkdir -p "app/src/main/jniLibs/$abi"
            cp "$so" "app/src/main/jniLibs/$abi/libnode.so"
            echo "staged: app/src/main/jniLibs/$abi/libnode.so"
          done
          inc="$(find /tmp/nodejs-mobile -maxdepth 2 -type d -name include | head -n 1)"
          if [ -z "$inc" ]; then
            echo "FATAL: include/ dir not found in nodejs-mobile zip"
            unzip -l /tmp/nodejs-mobile.zip | head -n 60
            exit 1
          fi
          rm -rf thirdparty/nodejs-mobile/include
          mkdir -p thirdparty/nodejs-mobile
          cp -r "$inc" thirdparty/nodejs-mobile/include
          echo "staged: thirdparty/nodejs-mobile/include"

      - name: Build debug APK and run JVM unit tests
        shell: bash
        run: |
          set -euo pipefail
          gradle assembleDebug testDebugUnitTest --console=plain --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: opendots-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
